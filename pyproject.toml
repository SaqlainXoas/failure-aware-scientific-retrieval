[project]
name = "failure-aware-scientific-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ir-datasets>=0.6.3",
    "pyyaml>=6.0.3",
    "bm25s>=0.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires network access (ir_datasets download/cache)",
]
addopts = "-m 'not integration'"
