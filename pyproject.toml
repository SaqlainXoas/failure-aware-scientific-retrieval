[project]
name = "failure-aware-scientific-retrieval"
version = "0.1.0"
description = "A controlled SciFact study comparing lexical, dense, and hybrid retrieval with cross-encoder reranking, separating candidate-set failures from reranking failures, and evaluating lightweight confidence signals for retrieval failure detection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["information-retrieval", "scifact", "reranking", "calibration", "bm25", "dense-retrieval"]
authors = [{ name = "Saqlain" }]
dependencies = [
    "ir-datasets>=0.6.3",
    "pyyaml>=6.0.3",
    "bm25s>=0.2.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs the real SciFact dataset (ir_datasets download/cache); skipped, not failed, when unavailable",
]
